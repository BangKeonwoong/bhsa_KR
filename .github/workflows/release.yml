name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build OS-specific release ZIPs
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Windows package
          STAGE_W="package-windows"
          rm -rf "$STAGE_W" && mkdir -p "$STAGE_W"
          cp -R ctt_viewer "$STAGE_W/"
          cp -R parser "$STAGE_W/"
          cp -R static "$STAGE_W/"
          cp -R font "$STAGE_W/"
          cp -v app.py start_viewer.bat start_viewer.ps1 setup_windows.ps1 README-RUN-windows.txt "$STAGE_W/" || true
          cp -v README.md CHANGELOG.md requirements.txt FIRST-RUN-CHECKLIST.md "$STAGE_W/"
          mkdir -p "$STAGE_W/data/wheels"
          if [ -d data/ctt ]; then cp -R data/ctt "$STAGE_W/data/"; fi
          if [ -f data/gloss_ko.csv ]; then cp -v data/gloss_ko.csv "$STAGE_W/data/"; fi
          if [ -f data/README.md ]; then cp -v data/README.md "$STAGE_W/data/"; fi
          if [ -f data/wheels/README.md ]; then cp -v data/wheels/README.md "$STAGE_W/data/wheels/"; fi
          (cd "$STAGE_W" && zip -r "../ctt_viewer-windows-${TAG}.zip" .)
          # macOS package
          STAGE_M="package-macos"
          rm -rf "$STAGE_M" && mkdir -p "$STAGE_M"
          cp -R ctt_viewer "$STAGE_M/"
          cp -R parser "$STAGE_M/"
          cp -R static "$STAGE_M/"
          cp -R font "$STAGE_M/"
          cp -v app.py run.sh "Start Viewer.command" README-RUN-macOS.txt "$STAGE_M/" || true
          cp -v README.md CHANGELOG.md requirements.txt FIRST-RUN-CHECKLIST.md "$STAGE_M/"
          mkdir -p "$STAGE_M/data/wheels"
          if [ -d data/ctt ]; then cp -R data/ctt "$STAGE_M/data/"; fi
          if [ -f data/gloss_ko.csv ]; then cp -v data/gloss_ko.csv "$STAGE_M/data/"; fi
          if [ -f data/README.md ]; then cp -v data/README.md "$STAGE_M/data/"; fi
          if [ -f data/wheels/README.md ]; then cp -v data/wheels/README.md "$STAGE_M/data/wheels/"; fi
          (cd "$STAGE_M" && zip -r "../ctt_viewer-macos-${TAG}.zip" .)
          echo "FILES=ctt_viewer-windows-${TAG}.zip,ctt_viewer-macos-${TAG}.zip" >> $GITHUB_ENV
      - name: Build Windows portable ZIP (embedded Python + preinstalled deps)
        run: |
          set -euxo pipefail
          TAG="${GITHUB_REF_NAME}"
          STAGE="package-windows-portable"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # App files
          cp -R ctt_viewer "$STAGE/"
          cp -R parser "$STAGE/"
          cp -R static "$STAGE/"
          cp -R font "$STAGE/"
          cp -v app.py "Start Viewer (Portable).bat" README-RUN-windows.txt README.md CHANGELOG.md requirements.txt "$STAGE/" || true
          # Download Windows embeddable Python
          VER=3.11.8
          URL="https://www.python.org/ftp/python/${VER}/python-${VER}-embed-amd64.zip"
          curl -L "$URL" -o pyembed.zip
          mkdir -p "$STAGE/python-embed"
          unzip -q pyembed.zip -d "$STAGE/python-embed"
          rm -f pyembed.zip
          # Prepare site-packages and install wheels for Windows (cp311 win_amd64)
          mkdir -p "$STAGE/python-embed/Lib/site-packages"
          python -m pip download --only-binary=:all: \
            --platform win_amd64 --implementation cp --python-version 311 --abi cp311 \
            -r requirements.txt -d winwheels
          python - << 'PY'
import os, zipfile
st = os.environ['STAGE'] if 'STAGE' in os.environ else 'package-windows-portable'
site = os.path.join(st, 'python-embed', 'Lib', 'site-packages')
os.makedirs(site, exist_ok=True)
for whl in os.listdir('winwheels'):
    if not whl.endswith('.whl'): continue
    p = os.path.join('winwheels', whl)
    with zipfile.ZipFile(p) as z:
        z.extractall(site)
print('installed wheels into', site)
PY
          # Enable site-packages by editing _pth
          PTH=$(ls "$STAGE/python-embed"/*._pth | head -n1)
          printf "Lib\\site-packages\nimport site\n" >> "$PTH"
          # Create ZIP
          (cd "$STAGE" && zip -r "../ctt_viewer-windows-portable-${TAG}.zip" .)
          echo "FILES=${FILES},ctt_viewer-windows-portable-${TAG}.zip" >> $GITHUB_ENV
      - name: Prepare release notes from CHANGELOG
        id: notes
        run: |
          set -euxo pipefail
          VER="${GITHUB_REF_NAME#v}"
          # Extract section starting at '## [VER]' until next '## ['
          awk -v ver="$VER" 'BEGIN{p=0} 
            /^## \[/ { if (p==1) exit }
            $0 ~ ("^## \\[" ver "\\]") { p=1; next }
            p==1 { print }' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then 
            echo "CTT Viewer v${VER}" > notes.md
            echo "" >> notes.md
            echo "See CHANGELOG.md for details." >> notes.md
          fi
          echo "BODY_PATH=notes.md" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.FILES }}
          body_path: ${{ steps.notes.outputs.BODY_PATH }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
