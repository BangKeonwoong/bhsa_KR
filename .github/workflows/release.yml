name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  create:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Build lightweight release ZIP
        run: |
          set -euxo pipefail
          NAME="ctt_viewer-${GITHUB_REF_NAME}.zip"
          STAGE="package"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          # Core app code
          cp -R ctt_viewer "$STAGE/"
          cp -R parser "$STAGE/"
          cp -R static "$STAGE/"
          cp -R font "$STAGE/"
          # Launchers and docs
          cp -v app.py run.sh start_viewer.bat start_viewer.ps1 "Start Viewer.command" setup_windows.ps1 README-RUN.txt "$STAGE/" || true
          cp -v README.md CHANGELOG.md requirements.txt "$STAGE/"
          # Minimal data: sample CTT + gloss CSV + wheels readme
          mkdir -p "$STAGE/data/ctt" "$STAGE/data/wheels"
          if [ -d data/ctt ]; then cp -R data/ctt "$STAGE/data/"; fi
          if [ -f data/gloss_ko.csv ]; then cp -v data/gloss_ko.csv "$STAGE/data/"; fi
          if [ -f data/README.md ]; then mkdir -p "$STAGE/data"; cp -v data/README.md "$STAGE/data/"; fi
          if [ -f data/wheels/README.md ]; then mkdir -p "$STAGE/data/wheels"; cp -v data/wheels/README.md "$STAGE/data/wheels/"; fi
          # Create zip
          (cd "$STAGE" && zip -r "../$NAME" .)
          ls -lh "$NAME"
          echo "ASSET=$NAME" >> $GITHUB_ENV
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.ASSET }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
